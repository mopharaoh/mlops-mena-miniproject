services:
  prodml-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: prodml-house-prices:1.0.0

    container_name: prodml-api

    ports:
      - "8000:8000"

    environment:
      MODEL_VERSION: "1.0.0"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3