[project]
name = "prodml"
version = "0.1.0"
description = "Production-ready House Prices ML service"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "pandas",
    "scikit-learn",
    "joblib",
    "pyarrow",
    "python-json-logger",
    "numpy",
    "skl2onnx",
    "onnx",
    "onnxruntime",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
]


[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "httpx",
    "pre-commit",
]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src/prodml --cov-fail-under=70"