[project]
name = "prodml"
version = "0.1.0"
description = "Production-ready House Prices ML service"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "numpy",
    "scikit-learn",
    "joblib",
    "onnx",
    "onnxruntime",
    "skl2onnx",
    "python-json-logger",
    "httpx2>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
]

[project.scripts]
prodml-train = "prodml.train:main"
prodml-export = "prodml.export:main"
prodml-benchmark = "prodml.benchmark:main"

[build-system]
requires = [
    "setuptools>=68",
]

build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src/prodml --cov-fail-under=70"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
